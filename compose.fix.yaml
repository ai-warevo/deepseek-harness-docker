# compose.fix.yaml — local edits by loktionov129
# Merged on top of compose.yaml (base upstream)
# Run: docker compose -f compose.yaml -f compose.fix.yaml up -d
# docker compose -f compose.yaml -f compose.fix.yaml up --build -d
services:
  deepseek-harness:
    build:
      dockerfile: Dockerfile.fix
      args:
        WITH_GCC15: ${WITH_GCC15:-0}
    image: dshw:fix
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
      HOME: /home/node
      DSH_HOME: /home/node/.dsh
      XDG_CONFIG_HOME: /home/node/.config
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes: !override
      - ${DSH_WORKSPACE:-dsh-workspace}:/home/node/workspace
      - ./dsh-home:/home/node/.dsh
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    tmpfs: !override
      - /tmp:rw,exec,nosuid,nodev,size=2g
      - /home/node/.config/gh:rw,nosuid,nodev,size=64k

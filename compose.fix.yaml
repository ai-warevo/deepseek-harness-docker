# compose.fix.yaml — локальные правки loktionov129
# Merge-ится поверх compose.yaml (базовый upstream)
# Запуск: docker compose -f compose.yaml -f compose.fix.yaml up -d
services:
  deepseek-harness:
    build:
      dockerfile: Dockerfile.fix
      args:
        WITH_GCC15: ${WITH_GCC15:-0}
    image: dshw:fix
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    volumes:
      - ./dsh-home:/home/node/.dsh
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    tmpfs: !override
      - /tmp:rw,exec,nosuid,nodev,size=2g
